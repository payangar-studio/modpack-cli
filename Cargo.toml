[package]
name = "modpack-cli"
version = "0.1.0"
edition = "2024"
description = "CLI of the Minecraft modpack socle"
publish = false

[[bin]]
name = "modpack"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["password"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
